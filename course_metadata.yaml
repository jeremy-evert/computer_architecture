# Computer Architecture — durable course metadata
#
# This is the tracked source of truth for COMSC-3013's Fall 2026 offering.
# Official facts remain separate from Jeremy's instructional decisions.
# Git is authoritative; Canvas/Savnac copies are generated inspection/deployment surfaces.

course:
  code: "COMSC-3013"
  name: "Computer Architecture"
  credits: 3
  term: "Fall 2026"
  section_number: "COMSC-3013-1438"
  start_date: "2026-08-17"
  end_date: "2026-12-11"
  instructor: "Dr. Jeremy P. Evert"
  requisites: "None"
  catalog_offering_note: "Offered Spring Only"

official:
  modality: "Online"
  location: "Weatherford Campus (Main), Online W 1 / Online"
  meeting_pattern: "Asynchronous / online (no scheduled Banner meeting time)"
  catalog_description: >-
    Study of a modern computer system as a layered structure. Digital
    logic, microprogramming, Von Neumann machines, operating systems,
    assembly and high-level virtual machines, emphasizing fundamental
    concepts of each layer in the hierarchy and relationships between
    the layers.

instructional_working_cadence:
  days: "Monday / Wednesday / Friday"
  time: "2:00 PM"
  label: "Working instructional cadence (Jeremy's planning rhythm) -- not a Banner-listed meeting time"

required_materials_policy:
  commercial_textbook_required: false
  zybooks_required: false
  paid_ai_subscription_required: false
  paid_ai_cli_required: false
  student_cost_target: >-
    Every required course activity should have a zero-cost path beyond
    ordinary access to a computer and university/course infrastructure.
  doctrine: >-
    The course is authored to stand on open and freely accessible readings,
    references, tools, labs, and course-created materials. Commercial books,
    zyBooks, premium AI subscriptions, Codex, Claude Code, and similar paid
    tools may be recommended or demonstrated as optional accelerators, but no
    required assignment or grading outcome may depend on purchasing them.
  ai_choice: >-
    Students may use the AI provider/interface they prefer when AI use is
    allowed or encouraged. Required AI-supported activities must have a
    no-cost or otherwise course-accessible path. Premium command-line agents
    are optional enrichment, not a prerequisite.

teaching_isa:
  planning_choice: "RISC-V"
  status: "planning-leading choice"
  rationale: >-
    RISC-V aligns well with the accepted curriculum, has an open primary
    specification, strong open-source toolchains/simulators, and widespread
    use in contemporary computer-architecture teaching. Final lab-tool
    selection is validated separately; this field does not imply a commercial
    textbook or zyBooks dependency.

reference_resources:
  commercial_resources_required: false
  note: >-
    Textbooks and historical zyBooks materials are reference/provenance only.
    They may guide course authorship, sequencing, examples, and instructor
    preparation, but the student-facing required curriculum must be complete
    without them.
  historical_zybook:
    title: "Computer Organization and Design (6e) — Interactive Version (MIPS)"
    authors:
      - "David A. Patterson"
      - "John L. Hennessy"
    zybook_identifier: "SWOSUCOMSC3013EvertFall2026"
    zybook_url: "https://learn.zybooks.com/zybook/SWOSUCOMSC3013EvertFall2026"
    historical_zybook_identifiers:
      - "EvertCOD(MIPS)Jul2021"
    role: "historical/reference provenance; not required student material"
    main_chapters:
      - number: 1
        title: "Computer Abstractions and Technology"
      - number: 2
        title: "Instructions: Language of the Computer"
      - number: 3
        title: "Arithmetic for Computers"
      - number: 4
        title: "The Processor"
      - number: 5
        title: "Large and Fast: Exploiting Memory Hierarchy"
      - number: 6
        title: "Parallel Processors from Client to Cloud"

provenance:
  - source: "Jeremy's directly supplied Fall 2026 catalog/section record (2026-08-09)"
    covers: "course/official blocks"
  - source: "Jeremy's Fall 2026 planning decision"
    covers: "instructional_working_cadence"
  - source: "Jeremy, directly, 2026-08-16 conversation"
    covers: >-
      No required zyBooks/commercial textbook; prefer a complete open-source
      course. Paid AI subscriptions and paid CLI agents are not required.
      Premium AI/CLI tools may be optional enhancements only.
  - source: "Historical Fall 2026 zyBooks adoption records"
    covers: "reference_resources.historical_zybook"
